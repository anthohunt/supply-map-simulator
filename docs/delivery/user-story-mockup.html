<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Map Simulator — User Story Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   CSS VARIABLES — extracted verbatim from src/styles/variables.css
   ================================================================ */
:root {
  --bg: #242730;
  --surface: #29323C;
  --surface-elevated: #3A4552;
  --border: #3A4552;
  --text-primary: #D3D8E0;
  --text-secondary: #A0A7B4;
  --text-muted: #8A94A5;
  --accent: #1FBAD6;
  --accent-hover: #17A2BC;
  --accent-subtle: rgba(31, 186, 214, 0.15);
  --success: #4CAF50;
  --warning: #F5A623;
  --error: #EF5350;
  --hub-global: #F5A623;
  --hub-regional: #EF5350;
  --hub-gateway: #1FBAD6;
  --hub-local: #AB47BC;
  --hub-access: #66BB6A;
  --edge-global-regional: #F5A623;
  --edge-regional: #EF5350;
  --edge-gateway-local: #1FBAD6;
  --edge-access: #66BB6A;
  --font-family: 'Inter', 'Helvetica Neue', Helvetica, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-weight-heading: 600;
  --font-weight-body: 400;
  --font-xs: 11px;
  --font-sm: 12px;
  --font-base: 13px;
  --font-lg: 16px;
  --font-xl: 20px;
  --font-xxl: 28px;
  --radius: 2px;
  --radius-lg: 4px;
  --panel-padding: 16px;
  --gap: 8px;
  --shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
  --glow-hover: 0 0 8px rgba(31, 186, 214, 0.3);
  /* Stories panel (pipeline neutral style) */
  --sp-bg: #faf9f6;
  --sp-surface: #ffffff;
  --sp-border: #e5e2dc;
  --sp-text: #2d2a26;
  --sp-text-sec: #6b6660;
  --sp-accent: #4a7c59;
  --sp-radius: 10px;
}

/* ================================================================
   GLOBAL RESET — from src/styles/global.css
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  font-family: var(--font-family);
  font-size: var(--font-base);
  font-weight: var(--font-weight-body);
  color: var(--text-primary);
  background-color: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1,h2,h3,h4,h5,h6 { font-weight: var(--font-weight-heading); line-height: 1.3; }
button { cursor: pointer; font-family: var(--font-family); font-size: var(--font-base); border: none; background: none; color: inherit; }
input {
  font-family: var(--font-family); font-size: var(--font-base); color: var(--text-primary);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; outline: none; transition: border-color 0.2s;
}
input:focus { border-color: var(--accent); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface-elevated); border-radius: var(--radius); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ================================================================
   LAYOUT — from AppShell.module.css
   ================================================================ */
.shell { display: flex; width: 100%; height: 100%; overflow: hidden; }
.main { flex: 1; position: relative; overflow: hidden; }

/* ================================================================
   SIDEBAR — from Sidebar.module.css
   ================================================================ */
.sidebar {
  width: 300px; height: 100%; background: var(--bg);
  border-right: 1px solid var(--border); display: flex;
  flex-direction: column; z-index: 1000; overflow: hidden;
}
.sidebar-header {
  padding: 12px var(--panel-padding);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.logo { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--accent); letter-spacing: -0.3px; }
.stepper {
  display: flex; align-items: center; gap: 2px;
  padding: 8px var(--panel-padding); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.stepper-item { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.stepper-dot {
  width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0;
  background: var(--surface-elevated); color: var(--text-muted);
}
.stepper-label { font-size: var(--font-xs); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper-item.active .stepper-dot { background: var(--accent); color: var(--bg); }
.stepper-item.active .stepper-label { color: var(--accent); font-weight: var(--font-weight-heading); }
.stepper-item.done .stepper-dot { background: rgba(76, 175, 80, 0.15); color: var(--success); }
.stepper-item.done .stepper-label { color: var(--text-secondary); }
.sidebar-content { flex: 1; overflow-y: auto; }

/* ================================================================
   TERRITORY INPUT — from TerritoryInput.module.css
   ================================================================ */
.ti-container { padding: var(--panel-padding); }
.ti-title { font-size: var(--font-xl); font-weight: var(--font-weight-heading); color: var(--text-primary); margin-bottom: var(--gap); }
.ti-subtitle { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
.ti-search-wrapper { position: relative; }
.ti-search-input {
  width: 100%; padding: 10px 12px; font-size: var(--font-base);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text-primary); outline: none; transition: border-color 0.2s;
}
.ti-search-input::placeholder { color: var(--text-muted); }
.ti-selected {
  margin-top: 16px; padding: 12px; background: var(--accent-subtle);
  border: 1px solid var(--accent); border-radius: var(--radius);
}
.ti-selected-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.ti-selected-name { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--text-primary); }
.ti-selected-type { font-size: var(--font-xs); color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
.ti-start-btn {
  width: 100%; padding: 10px 16px; background: var(--accent); color: var(--bg);
  font-size: var(--font-base); font-weight: var(--font-weight-heading); border: none;
  border-radius: var(--radius); cursor: pointer; transition: background-color 0.2s, box-shadow 0.2s;
}
.ti-start-btn:hover { background: var(--accent-hover); box-shadow: var(--glow-hover); }

/* ================================================================
   DATA PIPELINE — from DataPipeline.module.css
   ================================================================ */
.dp-dashboard { padding: var(--panel-padding); }
.dp-title { font-size: var(--font-xl); font-weight: var(--font-weight-heading); color: var(--text-primary); margin-bottom: 4px; }
.dp-territory { font-size: var(--font-sm); color: var(--accent); margin-bottom: 16px; }
.dp-overall { margin-bottom: 20px; }
.dp-overall-label { display: flex; justify-content: space-between; align-items: center; font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: 6px; }
.dp-progress-bar { width: 100%; height: 6px; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.dp-progress-fill { height: 100%; background: var(--accent); border-radius: var(--radius); transition: width 0.3s ease; }
.dp-progress-fill.complete { background: var(--success); }
.dp-panels { display: flex; flex-direction: column; gap: 12px; }
.dp-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; }
.dp-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.dp-panel-title { font-size: var(--font-base); font-weight: var(--font-weight-heading); color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.dp-panel-hint {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%; background: var(--surface-elevated);
  color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: help; flex-shrink: 0;
}
.dp-panel-desc { font-size: var(--font-xs); color: var(--text-secondary); margin-bottom: 8px; line-height: 1.4; }
.dp-elapsed { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: var(--font-xs); color: var(--accent); }
.dp-panel-status { font-size: var(--font-xs); text-transform: uppercase; letter-spacing: 0.5px; }
.dp-status-loading { color: var(--accent); }
.dp-status-complete { color: var(--success); }
.dp-status-error { color: var(--error); }
.dp-panel-progress { width: 100%; height: 4px; background: var(--bg); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
.dp-panel-progress-fill { height: 100%; background: var(--accent); border-radius: var(--radius); transition: width 0.2s ease; }
.dp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dp-stat-label { font-size: var(--font-xs); color: var(--text-muted); }
.dp-stat-value { font-size: var(--font-base); font-weight: var(--font-weight-heading); color: var(--text-primary); font-family: var(--font-mono); }
.dp-warning { font-size: var(--font-sm); color: var(--warning); margin-top: 4px; margin-bottom: 8px; }
.dp-next-step { margin-top: 16px; padding: 12px; background: var(--accent-subtle); border: 1px solid var(--accent); border-radius: var(--radius-lg); }
.dp-next-text { font-size: var(--font-sm); color: var(--text-primary); margin-bottom: 10px; }
.dp-next-btn {
  width: 100%; padding: 10px 12px; font-size: var(--font-base); font-weight: var(--font-weight-heading);
  color: var(--bg); background: var(--accent); border: none; border-radius: var(--radius); cursor: pointer;
}
.dp-change-btn {
  margin-top: 16px; width: 100%; padding: 8px 12px; font-size: var(--font-sm);
  color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
}
.dp-sub-progress { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.dp-sub-row { display: flex; align-items: center; gap: 8px; }
.dp-sub-label { font-size: var(--font-xs); color: var(--text-muted); min-width: 40px; }
.dp-sub-bar { flex: 1; height: 3px; background: var(--bg); border-radius: var(--radius); overflow: hidden; }
.dp-sub-fill { height: 100%; background: var(--accent); }
.dp-commodity-filter { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.dp-commodity-label { font-size: var(--font-xs); color: var(--text-muted); display: block; margin-bottom: 6px; }
.dp-commodity-toggles { display: flex; flex-wrap: wrap; gap: 4px; }
.dp-commodity-chip {
  padding: 2px 8px; font-size: var(--font-xs); color: var(--text-primary);
  background: var(--accent-subtle); border: 1px solid var(--accent); border-radius: 12px; cursor: pointer;
}

/* ================================================================
   PIXELIZATION — from PixelizationControls.module.css
   ================================================================ */
.px-container { padding: var(--panel-padding); }
.px-title { font-size: var(--font-xl); font-weight: var(--font-weight-heading); color: var(--text-primary); margin-bottom: 4px; }
.px-subtitle { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: 16px; }
.px-status-bar { margin-bottom: 16px; }
.px-status-label { display: flex; justify-content: space-between; font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: 6px; }
.px-progress-bar { width: 100%; height: 6px; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.px-progress-fill { height: 100%; border-radius: var(--radius); transition: width 0.3s ease; }
.px-progress-fill.complete { background: var(--success); }
.px-progress-fill.active { background: var(--accent); }
.px-steps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.px-step { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.px-step.active { border-color: var(--accent); }
.px-step.complete { border-color: var(--success); }
.px-step-icon {
  width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: var(--font-xs); flex-shrink: 0;
}
.px-step-icon.pending { background: var(--surface-elevated); color: var(--text-muted); }
.px-step-icon.active { background: var(--accent-subtle); color: var(--accent); }
.px-step-icon.complete { background: rgba(76, 175, 80, 0.15); color: var(--success); }
.px-step-label { font-size: var(--font-sm); color: var(--text-primary); }
.px-step-label.muted { color: var(--text-muted); }
.px-results { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; margin-bottom: 16px; }
.px-results-title { font-size: var(--font-base); font-weight: var(--font-weight-heading); color: var(--text-primary); margin-bottom: 8px; }
.px-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.px-region-list { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.px-region-item { display: flex; align-items: center; gap: 8px; font-size: var(--font-sm); color: var(--text-secondary); }
.px-region-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.px-param-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; margin-bottom: 16px; }
.px-param-title { font-size: var(--font-base); font-weight: var(--font-weight-heading); color: var(--text-primary); margin-bottom: 12px; }
.px-param-row { margin-bottom: 10px; }
.px-param-label { display: block; font-size: var(--font-xs); color: var(--text-muted); margin-bottom: 4px; }
.px-param-control { display: flex; align-items: center; gap: 10px; }
.px-slider {
  flex: 1; appearance: none; height: 4px; background: var(--bg);
  border-radius: var(--radius); outline: none; cursor: pointer;
}
.px-slider::-webkit-slider-thumb {
  appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer;
}
.px-param-value { font-size: var(--font-sm); font-family: var(--font-mono); color: var(--text-primary); min-width: 30px; text-align: right; }
.px-run-btn {
  width: 100%; padding: 10px; font-size: var(--font-base); font-weight: var(--font-weight-heading);
  color: var(--bg); background: var(--accent); border: none; border-radius: var(--radius); cursor: pointer;
}
.px-back-btn {
  width: 100%; padding: 8px 12px; font-size: var(--font-sm); color: var(--text-secondary);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; margin-top: 8px;
}

/* ================================================================
   LAYERS / NETWORK EXPLORER — from Layers.module.css
   ================================================================ */
.lc-container { padding: var(--panel-padding); }
.lc-title { font-size: var(--font-xl); font-weight: var(--font-weight-heading); color: var(--text-primary); margin-bottom: 4px; }
.lc-hint { font-size: var(--font-xs); color: var(--text-secondary); line-height: 1.4; margin-bottom: 12px; }
.lc-section-title {
  font-size: var(--font-sm); font-weight: var(--font-weight-heading); color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--gap);
}
.lc-tier-toggle {
  display: flex; align-items: center; gap: var(--gap); padding: 6px 8px;
  border-radius: var(--radius-lg); cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left; font-family: var(--font-family); font-size: var(--font-base); color: var(--text-primary);
}
.lc-tier-toggle:hover { background: var(--surface); }
.lc-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.lc-tier-label { flex: 1; }
.lc-tier-count { font-size: var(--font-xs); color: var(--text-muted); font-family: var(--font-mono); }
.lc-check { font-size: var(--font-xs); color: var(--accent); width: 16px; text-align: center; }
.lc-divider { height: 1px; background: var(--border); margin: 12px 0; }
.lc-opacity-slider { margin-bottom: 8px; }
.lc-opacity-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.lc-opacity-label { font-size: var(--font-sm); color: var(--text-secondary); }
.lc-opacity-value { font-size: var(--font-xs); color: var(--text-muted); font-family: var(--font-mono); min-width: 32px; text-align: right; }
.lc-slider {
  width: 100%; height: 4px; appearance: none; background: var(--surface); border-radius: 2px; outline: none; cursor: pointer;
}
.lc-slider::-webkit-slider-thumb {
  appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
  cursor: pointer; border: 2px solid var(--bg); box-shadow: 0 0 4px rgba(31, 186, 214, 0.4);
}
.lc-view-toggle {
  display: flex; align-items: center; gap: var(--gap); padding: 6px 8px;
  border-radius: var(--radius-lg); cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left; font-family: var(--font-family); font-size: var(--font-base); color: var(--text-primary);
}
.lc-view-toggle:hover { background: var(--surface); }
.lc-view-toggle.active { background: var(--accent-subtle); }
.lc-export-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 10px 16px; background: var(--accent); color: var(--bg); border: none;
  border-radius: var(--radius-lg); font-family: var(--font-family); font-size: var(--font-base);
  font-weight: var(--font-weight-heading); cursor: pointer;
}

/* Tab switcher — from FlowAnalysis.module.css */
.tab-switcher { display: flex; border-bottom: 1px solid var(--border); padding: 0 var(--panel-padding); margin: 0 calc(-1 * var(--panel-padding)); }
.tab-btn {
  flex: 1; padding: 8px 4px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-muted); font-family: var(--font-family); font-size: var(--font-sm);
  cursor: pointer; text-align: center; transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Flow filters */
.ff-container { padding: var(--panel-padding); }
.ff-group { margin-bottom: 10px; }
.ff-label { font-size: var(--font-xs); color: var(--text-secondary); margin-bottom: 4px; display: block; }
.ff-select {
  width: 100%; padding: 6px 8px; background: var(--surface); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-lg); font-family: var(--font-family);
  font-size: var(--font-sm); appearance: none; cursor: pointer; outline: none;
}
.ff-clear {
  width: 100%; padding: 6px 12px; background: var(--surface); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius-lg); font-family: var(--font-family);
  font-size: var(--font-sm); cursor: pointer; margin-top: 8px;
}

/* Corridor table */
.ct-container { padding: var(--panel-padding); }
.ct-table { width: 100%; border-collapse: collapse; }
.ct-header { font-size: var(--font-xs); color: var(--text-muted); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); font-weight: var(--font-weight-heading); }
.ct-row { cursor: pointer; transition: background 0.15s; }
.ct-row:hover { background: var(--surface); }
.ct-row.selected { background: var(--accent-subtle); }
.ct-cell { padding: 6px; font-size: var(--font-sm); color: var(--text-primary); border-bottom: 1px solid rgba(58,69,82,0.4); }
.ct-cell-muted { padding: 6px; font-size: var(--font-xs); color: var(--text-muted); font-family: var(--font-mono); border-bottom: 1px solid rgba(58,69,82,0.4); }

/* Network stats */
.ns-container { padding: var(--panel-padding); }
.ns-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-bottom: 12px; }
.ns-card { padding: 8px; background: var(--surface); border-radius: var(--radius-lg); text-align: center; }
.ns-card-value { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--text-primary); font-family: var(--font-mono); }
.ns-card-label { font-size: var(--font-xs); color: var(--text-muted); margin-top: 2px; }
.ns-chart { background: var(--surface); border-radius: var(--radius-lg); padding: 12px; margin-bottom: 12px; }
.ns-chart-title { font-size: var(--font-sm); font-weight: var(--font-weight-heading); color: var(--text-secondary); margin-bottom: var(--gap); }
.ns-metric { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--surface); border-radius: var(--radius-lg); margin-bottom: 6px; }
.ns-metric-label { font-size: var(--font-sm); color: var(--text-secondary); }
.ns-metric-value { font-size: var(--font-base); font-weight: var(--font-weight-heading); color: var(--text-primary); font-family: var(--font-mono); }
.ns-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ns-bar-label { font-size: var(--font-xs); color: var(--text-muted); min-width: 60px; }
.ns-bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.ns-bar-fill { height: 100%; border-radius: 4px; }
.ns-bar-value { font-size: var(--font-xs); color: var(--text-primary); font-family: var(--font-mono); min-width: 50px; text-align: right; }

/* ================================================================
   HUB DETAIL PANEL — from HubDetail.module.css
   ================================================================ */
.hd-panel {
  position: absolute; top: 0; right: 0; width: 320px; height: 100%;
  background: var(--bg); border-left: 1px solid var(--border); box-shadow: var(--shadow);
  z-index: 1100; display: flex; flex-direction: column; overflow: hidden;
}
.hd-panel.hidden { display: none; }
.hd-header { display: flex; align-items: center; justify-content: space-between; padding: 12px var(--panel-padding); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.hd-name { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: var(--gap); }
.hd-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: var(--font-lg); padding: 4px; border-radius: var(--radius); line-height: 1; }
.hd-body { flex: 1; overflow-y: auto; padding: var(--panel-padding); }
.hd-tier-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-lg); font-size: var(--font-sm); font-weight: var(--font-weight-heading); color: var(--bg); margin-bottom: 12px; }
.hd-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-bottom: 16px; }
.hd-stat { background: var(--surface); padding: 10px; border-radius: var(--radius-lg); }
.hd-stat-label { font-size: var(--font-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
.hd-stat-value { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--text-primary); font-family: var(--font-mono); display: block; margin-top: 2px; }
.hd-section { margin-bottom: 16px; }
.hd-section-title { font-size: var(--font-sm); font-weight: var(--font-weight-heading); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--gap); }
.hd-section-note { font-size: var(--font-sm); color: var(--text-muted); font-style: italic; }
.hd-connected {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--radius-lg);
  cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
  font-family: var(--font-family); font-size: var(--font-sm); color: var(--accent);
}
.hd-connected:hover { background: var(--surface); }
.hd-connected-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ================================================================
   EXPORT MODAL — from Export.module.css
   ================================================================ */
.ex-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000;
  display: flex; align-items: center; justify-content: center;
}
.ex-overlay.hidden { display: none; }
.ex-modal {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); width: 680px; max-width: 90vw; max-height: 80vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.ex-header { display: flex; align-items: center; justify-content: space-between; padding: 12px var(--panel-padding); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ex-title { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--text-primary); }
.ex-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: var(--font-xl); padding: 4px; border-radius: var(--radius); line-height: 1; }
.ex-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 var(--panel-padding); flex-shrink: 0; }
.ex-tab {
  flex: 1; padding: 10px 4px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-muted); font-family: var(--font-family); font-size: var(--font-sm);
  cursor: pointer; text-align: center;
}
.ex-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.ex-content { flex: 1; overflow-y: auto; padding: var(--panel-padding); }
.ex-preview {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 12px; margin-bottom: 12px; max-height: 300px; overflow: auto;
  font-family: var(--font-mono); font-size: var(--font-xs); color: var(--text-secondary);
  white-space: pre-wrap; word-break: break-all; line-height: 1.5;
}
.ex-download {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 10px 16px; background: var(--accent); color: var(--bg); border: none;
  border-radius: var(--radius-lg); font-family: var(--font-family); font-size: var(--font-base);
  font-weight: var(--font-weight-heading); cursor: pointer;
}
.ex-stats-row { display: flex; gap: 12px; margin-bottom: 12px; }
.ex-stat-item { display: flex; flex-direction: column; padding: 8px 12px; background: var(--surface); border-radius: var(--radius-lg); flex: 1; }
.ex-stat-label { font-size: var(--font-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
.ex-stat-value { font-size: var(--font-lg); font-weight: var(--font-weight-heading); color: var(--text-primary); font-family: var(--font-mono); margin-top: 2px; }
.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.ex-chip {
  padding: 4px 10px; border-radius: var(--radius-lg); border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); font-family: var(--font-family); font-size: var(--font-xs); cursor: pointer;
}
.ex-chip.active { background: var(--accent-subtle); border-color: var(--accent); color: var(--accent); }

/* ================================================================
   MAP AREA — from Map.module.css
   ================================================================ */
.map-container { position: absolute; inset: 0; z-index: 0; background: var(--bg); }
.map-dark-tiles {
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(31,186,214,0.03) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(245,166,35,0.02) 0%, transparent 40%),
    var(--bg);
  position: relative;
}
/* Dot grid to simulate map tiles */
.map-dark-tiles::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(160,167,180,0.08) 1px, transparent 1px);
  background-size: 24px 24px;
}
/* Tile style picker */
.tile-picker {
  position: absolute; bottom: 24px; right: 16px; z-index: 1000;
  display: flex; gap: 6px; background: var(--bg); padding: 6px;
  border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow);
}
.tile-option {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px;
  border: 2px solid transparent; border-radius: var(--radius-lg); background: transparent; cursor: pointer;
}
.tile-option.selected { border-color: var(--accent); }
.tile-preview { width: 40px; height: 28px; border-radius: var(--radius); display: block; }
.tile-label { font-size: var(--font-xs); color: var(--text-secondary); }
.tile-option.selected .tile-label { color: var(--accent); }
/* Map controls on map */
.map-btn {
  position: absolute; z-index: 1000; padding: 6px 12px; background: var(--bg);
  color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg);
  font-family: var(--font-family); font-size: var(--font-sm); cursor: pointer; box-shadow: var(--shadow);
}
.map-btn.active { border-color: var(--accent); color: var(--accent); }
/* Zoom controls */
.zoom-controls {
  position: absolute; top: 12px; left: 12px; z-index: 1000;
  display: flex; flex-direction: column; gap: 0;
}
.zoom-btn {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--text-primary); border: 1px solid var(--border);
  font-size: 16px; font-weight: bold; cursor: pointer;
}
.zoom-btn:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.zoom-btn:last-child { border-radius: 0 0 var(--radius) var(--radius); border-top: none; }
/* Attribution */
.map-attribution {
  position: absolute; bottom: 4px; left: 4px; z-index: 500;
  background: rgba(36,39,48,0.8); color: var(--text-muted); font-size: var(--font-xs);
  padding: 2px 6px; border-radius: 2px;
}
.map-attribution a { color: var(--text-secondary); text-decoration: none; }

/* Split view */
.split-container { display: flex; position: absolute; inset: 0; z-index: 0; }
.split-left { flex: 1; position: relative; }
.split-right { flex: 1; position: relative; border-left: 2px solid var(--border); }
.split-label {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 1000;
  background: rgba(36,39,48,0.85); color: var(--text-secondary); font-size: var(--font-xs);
  padding: 3px 10px; border-radius: var(--radius-lg); border: 1px solid var(--border);
}

/* 3D canvas overlay */
.three-d-overlay {
  position: absolute; inset: 0; z-index: 650;
  background: linear-gradient(180deg, rgba(36,39,48,0.0) 0%, rgba(36,39,48,0.3) 100%);
  pointer-events: none;
}

/* Hub markers as CSS circles */
.hub-marker {
  position: absolute; border-radius: 50%; z-index: 600;
  box-shadow: 0 0 6px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}
.hub-marker:hover { transform: scale(1.3); z-index: 700; }
.hub-marker .hub-tooltip {
  display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: var(--bg); color: var(--text-primary); font-size: var(--font-xs);
  padding: 4px 8px; border-radius: var(--radius-lg); border: 1px solid var(--border);
  white-space: nowrap; margin-bottom: 4px; box-shadow: var(--shadow);
}
.hub-marker:hover .hub-tooltip { display: block; }
/* Edge lines */
.edge-line {
  position: absolute; height: 1px; z-index: 550; opacity: 0.5;
  transform-origin: 0 0;
}
/* Territory boundary */
.territory-boundary {
  position: absolute; border: 2px dashed var(--accent); opacity: 0.4;
  border-radius: 8px; z-index: 500;
}
/* Colored region shapes */
.region-shape {
  position: absolute; border-radius: 12px; z-index: 520; opacity: 0.15;
}

/* ================================================================
   STORIES PANEL (right sidebar, pipeline neutral style)
   ================================================================ */
.stories-panel {
  width: 340px; height: 100%; background: var(--sp-bg); border-left: 1px solid var(--sp-border);
  display: flex; flex-direction: column; overflow: hidden;
  font-family: 'DM Sans', sans-serif;
}
.sp-header { padding: 14px 16px; border-bottom: 1px solid var(--sp-border); flex-shrink: 0; }
.sp-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; color: var(--sp-text); }
.sp-subtitle { font-size: 12px; color: var(--sp-text-sec); margin-top: 2px; }
.sp-nav { display: flex; gap: 0; border-bottom: 1px solid var(--sp-border); flex-shrink: 0; overflow-x: auto; }
.sp-nav-btn {
  flex: none; padding: 8px 12px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--sp-text-sec); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer;
  white-space: nowrap; transition: color 0.15s, border-color 0.15s;
}
.sp-nav-btn:hover { color: var(--sp-text); }
.sp-nav-btn.active { color: var(--sp-accent); border-bottom-color: var(--sp-accent); font-weight: 500; }
.sp-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
.sp-story {
  padding: 10px 12px; margin-bottom: 8px; background: var(--sp-surface);
  border: 1px solid var(--sp-border); border-radius: var(--sp-radius);
  cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
}
.sp-story:hover { border-color: var(--sp-accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.sp-story.active { border-color: var(--sp-accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.sp-story-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.sp-story-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--sp-text-sec); }
.sp-badge {
  display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 10px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px;
}
.sp-badge.unchanged { background: #e8f5e9; color: #2e7d32; }
.sp-badge.modified { background: #fff3e0; color: #e65100; }
.sp-badge.new { background: #e3f2fd; color: #1565c0; }
.sp-badge.partial { background: #fff8e1; color: #f9a825; }
.sp-story-title { font-size: 13px; font-weight: 500; color: var(--sp-text); line-height: 1.4; }
.sp-story-summary { font-size: 11px; color: var(--sp-text-sec); margin-top: 4px; line-height: 1.4; }

/* ================================================================
   FLOW ANIMATION DOTS on map
   ================================================================ */
@keyframes flowParticle {
  0% { offset-distance: 0%; opacity: 0; }
  5% { opacity: 1; }
  95% { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes progressPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.pulse { animation: progressPulse 1.5s ease-in-out infinite; }
</style>
</head>
<body>

<div class="shell">
  <!-- ═══════════════ LEFT SIDEBAR ═══════════════ -->

</div>

function renderStepper() {
  const el = document.getElementById('stepper');
  const idx = STEPS.findIndex(s => s.id === currentScreen);
  el.innerHTML = STEPS.map((s, i) => {
    const state = i < idx ? 'done' : i === idx ? 'active' : '';
    const dot = state === 'done' ? '\u2713' : (i + 1);
    return `<div class="stepper-item ${state}"><span class="stepper-dot">${dot}</span><span class="stepper-label">${s.label}</span></div>`;
  }).join('');
}

        <button class="zoom-btn">+</button>
        <button class="zoom-btn">&minus;</button>
      </div>
      <div class="map-attribution"><a href="#">Leaflet</a> | &copy; <a href="#">CartoDB</a></div>
    </div>`;
}

function renderHubMarkers() {
  return MOCK_HUBS.map(h => {
    const s = TIER_SIZE[h.tier];
    return `<div class="hub-marker" style="left:${h.x}%;top:${h.y}%;width:${s}px;height:${s}px;background:${TIER_COLORS[h.tier]};margin-left:${-s/2}px;margin-top:${-s/2}px;">
      <div class="hub-tooltip">${h.name}<br><span style="color:var(--text-muted);font-size:10px;">${h.tier.charAt(0).toUpperCase()+h.tier.slice(1)} &middot; ${h.throughput} tons</span></div>
    </div>`;
  }).join('');
}

function renderEdges() {
  return EDGES.map(([a, b]) => {
    const ha = MOCK_HUBS[a], hb = MOCK_HUBS[b];
    const x1 = ha.x, y1 = ha.y, x2 = hb.x, y2 = hb.y;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const color = TIER_COLORS[ha.tier];
    return `<div class="edge-line" style="left:${x1}%;top:${y1}%;width:${len}%;transform:rotate(${angle}deg);background:${color};"></div>`;
  }).join('');
}

function renderRegionShapes() {
  const regions = [
    { x: 32, y: 38, w: 28, h: 30, color: REGION_COLORS[0] },
    { x: 50, y: 22, w: 24, h: 28, color: REGION_COLORS[1] },
    { x: 10, y: 50, w: 22, h: 30, color: REGION_COLORS[2] },
    { x: 22, y: 20, w: 22, h: 22, color: REGION_COLORS[3] },
    { x: 50, y: 62, w: 22, h: 28, color: REGION_COLORS[4] },
  ];
  return regions.map(r =>
    `<div class="region-shape" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;background:${r.color};"></div>`
  ).join('');
}

function renderTilePicker() {
  const tiles = [
    { name: 'Dark', bg: '#1a1a2e' },
    { name: 'Light', bg: '#e8e8e8' },
    { name: 'Satellite', bg: '#2d4a3e' },
    { name: 'Terrain', bg: '#d4c5a0' },
  ];
  return `<div class="tile-picker">${tiles.map((t, i) =>
    `<div class="tile-option ${i===0?'selected':''}">
      <div class="tile-preview" style="background:${t.bg};"></div>
      <span class="tile-label">${t.name}</span>
    </div>`
  ).join('')}</div>`;
}

/* ================================================================
   STORIES PANEL
   ================================================================ */
function renderStoriesNav() {
  const nav = document.getElementById('sp-nav');
  nav.innerHTML = SECTIONS.map(s =>
    `<button class="sp-nav-btn ${s.id===currentSection?'active':''}" onclick="setSection('${s.id}')">${s.label}</button>`
  ).join('');
}

function renderStories() {
  const body = document.getElementById('sp-body');
  const filtered = STORIES.filter(s => s.section === currentSection);
  body.innerHTML = filtered.map(s => `
    <div class="sp-story ${s.id===activeStoryId?'active':''}" onclick="selectStory('${s.id}','${s.screen}')">
      <div class="sp-story-header">
        <span class="sp-story-id">${s.id}</span>
        <span class="sp-badge ${s.status}">${s.status}</span>
      </div>
      <div class="sp-story-title">${s.title}</div>
      <div class="sp-story-summary">${s.summary}</div>
    </div>
  `).join('');
}

/* ================================================================
   NAVIGATION / ACTIONS
   ================================================================ */
function goScreen(screen) {
  currentScreen = screen;
  render();
}

function setSection(section) {
  currentSection = section;
  renderStoriesNav();
  renderStories();
}

function selectStory(id, screen) {
  activeStoryId = id;
  if (screen !== currentScreen) {
    currentScreen = screen;
  }
  render();
}

function setFlowTab(tab) {
  activeFlowTab = tab;
  renderSidebar();
}

function showExport() {
  document.getElementById('export-modal').classList.remove('hidden');
}
function hideExport() {
  document.getElementById('export-modal').classList.add('hidden');
}

function showSplitView() {
  const el = document.getElementById('main-area');
  el.innerHTML = `
    <div class="split-container">
      <div class="split-left">
        ${renderMapBase(renderEdges() + renderHubMarkers())}
        <div class="split-label">Primary</div>
      </div>
      <div class="split-right">
        ${renderMapBase(renderHubMarkers())}
        <div class="split-label">Comparison</div>
      </div>
    </div>`;
}

/* Hub detail panel */
function showHubDetail() {
  const hub = MOCK_HUBS[0];
  const panel = document.createElement('div');
  panel.className = 'hd-panel';
  panel.id = 'hub-detail';
  panel.innerHTML = `
    <div class="hd-header">
      <span class="hd-name">${hub.name}</span>
      <button class="hd-close" onclick="document.getElementById('hub-detail').remove()">&times;</button>
    </div>
    <div class="hd-body">
      <div class="hd-tier-badge" style="background:${TIER_COLORS[hub.tier]}">Global</div>
      <div class="hd-stats-grid">
        <div class="hd-stat"><span class="hd-stat-label">Throughput</span><span class="hd-stat-value">${hub.throughput}</span></div>
        <div class="hd-stat"><span class="hd-stat-label">Capacity</span><span class="hd-stat-value">${hub.capacity}</span></div>
      </div>
      <div class="hd-section">
        <div class="hd-section-title">Candidate Sites</div>
        <div style="font-size:var(--font-sm);color:var(--text-secondary);padding:4px 0;">Hartsfield Logistics Park (warehouse)</div>
        <div style="font-size:var(--font-sm);color:var(--text-secondary);padding:4px 0;">South Atlanta DC (distribution center)</div>
        <div style="font-size:var(--font-sm);color:var(--text-secondary);padding:4px 0;">Forest Park Terminal (terminal)</div>
      </div>
      <div class="hd-section">
        <div class="hd-section-title">Connected Hubs (4)</div>
        <button class="hd-connected"><span class="hd-connected-dot" style="background:#EF5350"></span>Charlotte Hub</button>
        <button class="hd-connected"><span class="hd-connected-dot" style="background:#1FBAD6"></span>Nashville Gateway</button>
        <button class="hd-connected"><span class="hd-connected-dot" style="background:#AB47BC"></span>Birmingham Local</button>
        <button class="hd-connected"><span class="hd-connected-dot" style="background:#1FBAD6"></span>Savannah Terminal</button>
      </div>
    </div>`;
  document.getElementById('main-area').appendChild(panel);
}

/* ================================================================
   MAIN RENDER
   ================================================================ */
function render() {
  renderStepper();
  renderSidebar();
  renderMap();
  renderStoriesNav();
  renderStories();
}

// Initial render
render();

// Show hub detail on network-map screen by clicking any hub
document.addEventListener('click', (e) => {
  const hub = e.target.closest('.hub-marker');
  if (hub && !document.getElementById('hub-detail')) {
    showHubDetail();
  }
});

// Close export on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    hideExport();
    const hd = document.getElementById('hub-detail');
    if (hd) hd.remove();
  }
});
</script>
</body>
</html>
